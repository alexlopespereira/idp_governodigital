exercicio: "1.4"
titulo: "Agente cria arquivo, abre PR e merge"
turmas:
  - TD-2026-01
disponivel_a_partir_de: 2026-05-13T08:00:00-03:00
prazo:
  recomendado_ate: 2026-05-20T23:59:59-03:00
criterios:
  - id: repo_existe
    peso: 10
    check: github.repo.exists
  - id: repo_publico
    peso: 10
    check: github.repo.public
  - id: nome_repo
    peso: 10
    check: github.repo.name_matches
    args:
      pattern: meu-terceiro-repo
  - id: pr_mergeado
    peso: 20
    check: github.pr.count
    args:
      state: merged
      min: 1
  - id: pelo_menos_2_commits
    peso: 15
    check: github.commits.count_at_least
    args:
      n: 2
  - id: gh_authenticated
    peso: 10
    check: evidence.shell.gh_auth_ok
  - id: gh_repo_view_ok
    peso: 15
    check: evidence.shell.gh_repo_view_ok
perguntas:
  - texto: "Como você instruiu o agente para criar o arquivo, abrir o PR e fazer o merge? Explique o papel de cada comando do gh executado."
    criterios_avaliacao: |
      Resposta deve (1) descrever o prompt/instrução dada ao agente em palavras
      próprias e (2) explicar o que pelo menos 2 comandos do gh CLI executados
      pelo agente fazem (ex: gh pr create abre PR a partir da branch atual,
      gh pr merge faz merge na main e fecha o PR). Rejeitar respostas evasivas
      ("o agente fez tudo automático") ou copy-paste do enunciado/output.
    peso: 10
