exercicio: "2.1"
titulo: "Mapa de Atores da Jornada de um Serviço Público (serviço à escolha do aluno)"
turmas:
  - TD-2026-01
disponivel_a_partir_de: 2026-05-17T00:00:00-03:00
prazo:
  recomendado_ate: 2026-06-14T23:59:59-03:00
# Mapeamento role → path consumido pelo CLI (collect_artifacts_evidence) e
# referenciado por cada criterio.args.role abaixo. Fonte única — não duplicar
# em código.
artefatos:
  - role: meta_prompt
    path: A_meta_prompt.md
  - role: assistente_v1
    path: B_relatorio_assistente_v1.md
  - role: assistente_v2
    path: B_relatorio_assistente_v2.md
  - role: assistente_v3
    path: B_relatorio_assistente_v3.md
  - role: auditoria_v1
    path: B_relatorio_auditoria_v1.md
  - role: auditoria_v2
    path: B_relatorio_auditoria_v2.md
  - role: grill_transcript
    path: C_grill_transcript.md
  - role: actor_map
    path: C_mapa_atores.md
criterios:
  # === Parte A — Meta-prompt (20 pts) ===
  # A_existe é gating: zero peso, mas se falhar o judge nem é chamado
  # (judge primitive já reprova quando artefato ausente, então zero peso aqui
  # serve só de mensagem clara no boletim).
  - id: A_existe
    peso: 0
    check: evidence.artifacts.exists
    args:
      role: meta_prompt
  - id: A_meta_prompt_quality
    peso: 20
    check: judge.artifacts.meta_prompt_quality
    args:
      role: meta_prompt
      sub_criterios:
        - "Escopo explícito de UM serviço público concreto e nomeado — qual serviço, qual canal de atendimento, qual órgão — sem ambiguidade (NÃO precisa ser a URA/Caixa: qualquer serviço público que o aluno domine)"
        - "Prompt estruturado com pelo menos 3 subseções distintas (ex.: contexto, instruções, formato de saída, critérios de fonte) — não fica em parágrafo único corrido"


  # === Parte B — Auditoria iterativa (40 pts) ===
  # Fluxo: assistente_v1 → auditoria_v1 → assistente_v2 → auditoria_v2 → assistente_v3
  # 5 arquivos. Síntese versionada saiu de cena: o "adversarial" agora é a
  # cadeia de auditoria entre dois assistentes, não uma reflexão escrita
  # pelo aluno. O papel do aluno em B é ORQUESTRAR (prompts + cópia entre
  # janelas), não sintetizar.

  # --- Determinístico (20 pts) ---
  - id: B1_iteracoes_distintas
    peso: 4
    check: evidence.artifacts.distinct_reports
    args:
      roles:
        - assistente_v1
        - assistente_v2
        - assistente_v3
  - id: B2_auditorias_distintas
    peso: 2
    check: evidence.artifacts.distinct_reports
    args:
      roles:
        - auditoria_v1
        - auditoria_v2
  - id: B3_palavras_v1
    peso: 2
    check: evidence.artifacts.word_count_min
    args:
      role: assistente_v1
      min: 300
  - id: B4_palavras_v2
    peso: 2
    check: evidence.artifacts.word_count_min
    args:
      role: assistente_v2
      min: 300
  - id: B5_palavras_v3
    peso: 2
    check: evidence.artifacts.word_count_min
    args:
      role: assistente_v3
      min: 300
  - id: B6_palavras_audit_v1
    peso: 2
    check: evidence.artifacts.word_count_min
    args:
      role: auditoria_v1
      min: 300
  - id: B7_palavras_audit_v2
    peso: 2
    check: evidence.artifacts.word_count_min
    args:
      role: auditoria_v2
      min: 300
  - id: B8_urls_v1
    peso: 2
    check: evidence.artifacts.links_min
    args:
      role: assistente_v1
      min: 3
  - id: B9_urls_v3
    peso: 2
    check: evidence.artifacts.links_min
    args:
      role: assistente_v3
      min: 3

  # --- LLM-judge (20 pts) ---
  - id: B10_audit_v1_substantiva
    peso: 8
    check: judge.artifacts.audit_finds_real_issues
    args:
      role_audit: auditoria_v1
      role_audited: assistente_v1
  - id: B11_v2_aborda_audit_v1
    peso: 6
    check: judge.artifacts.iteration_addresses_audit
    args:
      role_iteration: assistente_v2
      role_audit: auditoria_v1
  - id: B12_v3_evolucao_pos_audit_v2
    peso: 6
    check: judge.artifacts.iteration_addresses_audit
    args:
      role_iteration: assistente_v3
      role_audit: auditoria_v2

  # === Parte C — Mapa via grill-me (40 pts) ===
  - id: C1_rodadas
    peso: 8
    check: judge.artifacts.grill_rounds
    args:
      role: grill_transcript
      min_rounds: 6
  # C2_C3_C5 consolidado: judge precisa ver mapa + transcript juntos pra
  # responder qualquer um deles. Separar triplicaria custo de tokens.
  # Tutorial mantém divisão didática (C2/C3/C5); YAML consolida na execução.
  - id: C2_C3_C5_mapa_qualidade
    peso: 24
    check: judge.artifacts.actor_map_quality
    args:
      role_map: actor_map
      role_transcript: grill_transcript
      min_actors: 7
      # Tipagem humanos/IA não é exigida: exercício avalia diversidade de
      # atores (papéis/categorias) sem cobrar categoria humano-vs-IA.
      min_humans: 0
      min_ai: 0
  - id: C4_relacoes_explicitas
    peso: 8
    check: judge.artifacts.relations_explicit
    args:
      role: actor_map
