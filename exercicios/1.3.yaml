exercicio: "1.3"
titulo: "Agente cria repositório e clona"
turmas:
  - TD-2026-01
disponivel_a_partir_de: 2026-05-13T08:00:00-03:00
prazo:
  recomendado_ate: 2026-05-20T23:59:59-03:00
criterios:
  - id: repo_existe
    peso: 15
    check: github.repo.exists
  - id: repo_publico
    peso: 15
    check: github.repo.public
  - id: pelo_menos_1_commit
    peso: 15
    check: github.commits.count_at_least
    args:
      n: 1
  - id: nome_repo
    peso: 10
    check: github.repo.name_matches
    args:
      pattern: meu-segundo-repo
  - id: gh_authenticated
    peso: 15
    check: evidence.shell.gh_auth_ok
  - id: gh_version_capturado
    peso: 10
    check: evidence.shell.gh_version_present
  - id: gh_repo_view_ok
    peso: 20
    check: evidence.shell.gh_repo_view_ok
perguntas:
  - texto: "Como você instruiu o agente para criar o repositório e cloná-lo? O que cada comando do gh executado faz?"
    criterios_avaliacao: |
      Resposta deve (1) descrever o prompt/instrução dada ao agente em palavras
      próprias e (2) explicar o que pelo menos 2 comandos do gh CLI executados
      pelo agente fazem (ex: gh repo create cria repo remoto, gh repo clone
      baixa o repo localmente). Rejeitar respostas evasivas ("o agente fez tudo")
      ou copy-paste do enunciado/output dos comandos.
    peso: 10
