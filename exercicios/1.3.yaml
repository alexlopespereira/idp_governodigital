exercicio: "1.3"
titulo: "Agente cria repositório e clona"
turmas:
  - TD-2026-01
disponivel_a_partir_de: 2026-05-01T00:00:00-03:00
prazo:
  recomendado_ate: 2026-05-31T23:59:59-03:00
# Comandos shell que o CLI executa e que o backend valida (string equality).
# Placeholder {owner_repo} é substituído pelo CLI a partir do repo_url.
comandos_shell:
  - ["gh", "--version"]
  - ["gh", "auth", "status"]
  - ["gh", "repo", "view", "{owner_repo}", "--json", "visibility,name,isPrivate"]
criterios:
  - id: repo_existe
    peso: 20
    check: github.repo.exists
  - id: repo_publico
    peso: 20
    check: github.repo.public
  - id: pelo_menos_1_commit
    peso: 10
    check: github.commits.count_at_least
    args:
      n: 1
  - id: gh_authenticated
    peso: 15
    check: evidence.shell.gh_auth_ok
  - id: gh_version_capturado
    peso: 10
    check: evidence.shell.gh_version_present
  - id: gh_repo_view_ok
    peso: 15
    check: evidence.shell.gh_repo_view_ok
perguntas:
  - texto: "Como você instruiu o agente para criar o repositório e cloná-lo? O que cada comando do gh executado faz?"
    criterios_avaliacao: |
      Resposta deve (1) mostrar o prompt/instrução dada ao agente (pode ser
      copy-paste do prompt usado, NÃO precisa reescrever em palavras próprias)
      e (2) explicar COM SUAS PRÓPRIAS PALAVRAS o que pelo menos 2 comandos do
      gh CLI executados pelo agente fazem (ex: gh repo create cria repo remoto,
      gh repo clone baixa o repo localmente). Rejeitar respostas evasivas
      ("o agente fez tudo") na parte (2), ou copy-paste do output dos comandos
      como explicação.
    peso: 10
